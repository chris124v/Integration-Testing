[pytest]
# Opciones que se aplican siempre al ejecutar pytest dentro de pruebas/.
#   -v                           muestra el nombre y resultado de cada prueba
#   --browser chromium           Playwright usa Chromium
#   --video on                   graba un video de cada prueba que abre el navegador
#   --screenshot on              guarda una captura al terminar cada prueba con navegador
#   --tracing retain-on-failure  guarda la traza (trace.zip) solo si la prueba falla
#   --output test-results        carpeta de videos, capturas finales y trazas
#   --html / --self-contained-html  reporte HTML en un solo archivo, con las capturas incrustadas
addopts =
    -v
    --browser chromium
    --video on
    --screenshot on
    --tracing retain-on-failure
    --output test-results
    --html reporte/index.html
    --self-contained-html
